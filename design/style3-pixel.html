<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MC BDS · 设计 3 · 方块世界</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:2400px;overflow:hidden}
  body{
    font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#1b1b1b;
    background-color:#3a2a1c;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 8px, transparent 8px 32px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 8px, transparent 8px 32px),
      linear-gradient(45deg,#4a3523 25%,#3f2d1e 25% 50%,#4a3523 50% 75%,#3f2d1e 75%);
    background-size:32px 32px,32px 32px,64px 64px;
  }
  .phone{width:1080px;height:2400px;padding:54px 46px 38px;display:flex;flex-direction:column;position:relative}
  .phone:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 0%,rgba(0,0,0,.05),rgba(0,0,0,.55));pointer-events:none}
  header{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end}
  .logo{font-size:86px;font-weight:900;letter-spacing:2px;color:#fff;line-height:.95;
    text-shadow:0 6px 0 #1a1a1a,0 0 24px rgba(91,194,54,.35);font-family:"Courier New",monospace}
  .logo span{color:#5BC236}
  .tag{margin-top:16px;font-size:20px;letter-spacing:6px;color:#d8c7ae;font-weight:700}
  .lamp{display:flex;align-items:center;gap:12px;background:#2a1d13;border:5px solid #120d08;
    box-shadow:inset 4px 4px 0 #4c3827,inset -4px -4px 0 #0b0805;padding:14px 20px;color:#ff6b6b;font-weight:900;font-size:24px}
  .lamp i{width:18px;height:18px;background:#ff4d4d;box-shadow:0 0 16px #ff4d4d}
  main{position:relative;z-index:1;display:flex;flex-direction:column;gap:22px;margin-top:34px;flex:1}
  .panel{background:#c6c6c6;border:6px solid #151515;padding:30px;
    box-shadow:inset 6px 6px 0 #ffffff,inset -6px -6px 0 #5a5a5a,0 16px 0 rgba(0,0,0,.35)}
  .panel-title{font-size:22px;font-weight:900;letter-spacing:4px;color:#3a3a3a;margin-bottom:20px;
    text-shadow:1px 1px 0 #fff}
  .rows{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;justify-content:space-between;align-items:center;background:#a8a8a8;
    box-shadow:inset 3px 3px 0 #777,inset -3px -3px 0 #e0e0e0;padding:16px 20px}
  .row .k{font-size:22px;color:#2f2f2f;font-weight:700}
  .row .v{font-size:24px;color:#111;font-weight:900;font-family:"Courier New",monospace}
  .status-row{display:flex;gap:18px}
  .status-box{flex:1;background:#a8a8a8;box-shadow:inset 3px 3px 0 #777,inset -3px -3px 0 #e0e0e0;padding:22px}
  .status-box .lbl{font-size:19px;color:#4a4a4a;font-weight:700}
  .status-box .big{font-size:56px;font-weight:900;font-family:"Courier New",monospace;margin-top:6px}
  .status-box .big.red{color:#b3261e}
  .status-box .big.green{color:#2f7d1f}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .slot{background:#a8a8a8;box-shadow:inset 4px 4px 0 #777,inset -4px -4px 0 #e0e0e0;padding:20px;min-height:236px}
  .slot .top{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:#3a3a3a}
  .px{width:30px;height:30px;display:grid;place-items:center;background:#7d7d7d;box-shadow:inset 3px 3px 0 #5c5c5c,inset -3px -3px 0 #b0b0b0}
  .px svg{width:20px;height:20px;color:#1f3d12}
  .slot .val{font-family:"Courier New",monospace;font-size:44px;font-weight:900;margin-top:14px}
  .slot .val span{font-size:20px;color:#4a4a4a}
  .seg{display:flex;gap:4px;margin-top:16px}
  .seg i{flex:1;height:16px;background:#7b7b7b;box-shadow:inset 2px 2px 0 #5d5d5d}
  .seg i.on{background:#5BC236;box-shadow:inset 2px 2px 0 #7ee356}
  .net{display:flex;gap:22px;margin-top:14px}
  .net b{font-family:"Courier New",monospace;font-size:30px}
  .net small{display:block;font-size:14px;color:#4a4a4a;margin-top:2px;font-weight:700}
  .tps{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:16px}
  .tps i{flex:1;background:#5BC236;box-shadow:inset 2px 2px 0 #7ee356}
  .task{display:flex;align-items:center;gap:14px;background:#a8a8a8;box-shadow:inset 3px 3px 0 #777,inset -3px -3px 0 #e0e0e0;
    padding:14px 18px;margin-top:10px;font-size:20px;font-weight:800;color:#2f2f2f}
  .task .box{width:28px;height:28px;background:#7b7b7b;box-shadow:inset 3px 3px 0 #5d5d5d,inset -3px -3px 0 #b0b0b0;
    display:grid;place-items:center;color:#2f7d1f;font-size:18px;flex:none}
  .task.done .box:after{content:"✓"}
  .guide .steps{display:flex;gap:14px;margin-top:14px}
  .guide .steps div{flex:1;background:#a8a8a8;box-shadow:inset 3px 3px 0 #777,inset -3px -3px 0 #e0e0e0;
    padding:16px;font-size:17px;font-weight:800;color:#2f2f2f}
  .guide .steps b{display:block;color:#2f7d1f;font-family:"Courier New",monospace;font-size:22px;margin-bottom:6px}
  .manage{position:relative;z-index:1;height:120px;border:6px solid #111;cursor:pointer;
    background:#8b8b8b;color:#fff;font-size:34px;font-weight:900;letter-spacing:4px;
    text-shadow:3px 3px 0 #3f3f3f;box-shadow:inset 6px 6px 0 #c6c6c6,inset -6px -6px 0 #555,0 14px 0 rgba(0,0,0,.35)}
  .hotbar{position:relative;z-index:1;display:flex;gap:14px;background:#2a1d13;border:5px solid #120d08;
    box-shadow:inset 4px 4px 0 #4c3827,inset -4px -4px 0 #0b0805;padding:14px;margin-top:22px}
  .hslot{flex:1;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:#cbbba4;font-size:18px;font-weight:800;background:#3a2a1c;border:4px solid #1a120b;
    box-shadow:inset 4px 4px 0 #523b26,inset -4px -4px 0 #21160d}
  .hslot svg{width:36px;height:36px}
  .hslot.active{color:#eaffdf;border-color:#5BC236;box-shadow:inset 4px 4px 0 #7ee356,0 0 22px rgba(91,194,54,.35)}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div>
      <div class="logo">MC <span>BDS</span></div>
      <div class="tag">MINECRAFT BDS SERVER</div>
    </div>
    <div class="lamp"><i></i>已停止</div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-title">服务器信息</div>
      <div class="rows">
        <div class="row"><span class="k">服务器类型</span><span class="v">Minecraft BDS</span></div>
        <div class="row"><span class="k">服务端版本</span><span class="v">1.26.62.1</span></div>
        <div class="row"><span class="k">游戏版本</span><span class="v">1.26.62 · 协议 224</span></div>
        <div class="row"><span class="k">世界 / 端口</span><span class="v">Nether62 · 19134</span></div>
      </div>
      <div class="status-row" style="margin-top:16px">
        <div class="status-box"><div class="lbl">运行状态</div><div class="big red">关闭</div></div>
        <div class="status-box"><div class="lbl">玩家在线</div><div class="big green">0/10</div></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">服务器负荷</div>
      <div class="grid">
        <div class="slot">
          <div class="top"><span class="px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="7" width="10" height="10"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></span>CPU 占用</div>
          <div class="val">50<span>%</span></div>
          <div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="slot">
          <div class="top"><span class="px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10"/><path d="M7 17v3M12 17v3M17 17v3M7 10v4M11 10v4M15 10v4"/></svg></span>内存占用</div>
          <div class="val">2.1<span>GB</span></div>
          <div class="seg"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="slot">
          <div class="top"><span class="px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17V7m0 0L3 11m4-4 4 4M17 7v10m0 0 4-4m-4 4-4-4"/></svg></span>网络吞吐</div>
          <div class="net">
            <div><b>↑1</b><small>Mbps 上行</small></div>
            <div><b>↓1</b><small>Mbps 下行</small></div>
          </div>
        </div>
        <div class="slot">
          <div class="top"><span class="px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4M9 2h6"/></svg></span>服务器 TPS</div>
          <div class="val">20<span>/20</span></div>
          <div class="tps"><i style="height:100%"></i><i style="height:94%"></i><i style="height:100%"></i><i style="height:92%"></i><i style="height:100%"></i><i style="height:96%"></i><i style="height:100%"></i><i style="height:93%"></i><i style="height:100%"></i><i style="height:95%"></i></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">今日任务</div>
      <div class="task"><span class="box"></span>启动服务端</div>
      <div class="task"><span class="box"></span>局域网内连接一次</div>
      <div class="task"><span class="box"></span>邀请一位玩家进入</div>
    </section>

    <section class="panel guide">
      <div class="panel-title">如何进入</div>
      <div class="steps">
        <div><b>1</b>同一 Wi-Fi</div>
        <div><b>2</b>游戏 → 世界</div>
        <div><b>3</b>点击 Phone12662B</div>
      </div>
    </section>

    <button class="manage">服务器管理</button>
  </main>

  <nav class="hotbar">
    <div class="hslot active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      首页
    </div>
    <div class="hslot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
      控制台
    </div>
    <div class="hslot">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>
      AI
    </div>
    <div class="hslot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      设置
    </div>
  </nav>
</div>
</body>
</html>
